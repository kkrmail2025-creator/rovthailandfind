<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoV Finder Pro - ชุมชนหาเพื่อนเล่น</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #e74c3c;
            --gold: #f1c40f;
            --dark: #0f0f11;
            --card: #1c1c1f;
            --text: #ffffff;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding-bottom: 50px;
        }

        /* --- Header & Logo --- */
        header {
            background: linear-gradient(to bottom, #000, var(--dark));
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }

        .rov-logo {
            width: 120px;
            filter: drop-shadow(0 0 10px var(--primary));
            margin-bottom: 10px;
        }

        /* --- Auth Section --- */
        .auth-container {
            max-width: 400px;
            margin: 40px auto;
            background: var(--card);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #888; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Kanit';
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* --- Main Content --- */
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        
        .user-bar {
            background: #222;
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .post-card {
            background: var(--card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            border: 1px solid #2d2d30;
        }

        .post-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .username { color: var(--gold); font-weight: 600; }
        .phone-tag { font-size: 0.8rem; color: #777; }
        
        .room-display {
            background: #000;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 10px 0;
            border: 1px dashed var(--primary);
        }

        .room-id { font-size: 2rem; color: #2ecc71; font-family: monospace; letter-spacing: 5px; }

        .btn-delete {
            background: rgba(231, 76, 60, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .admin-badge {
            background: var(--gold);
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 5px;
        }

        #postForm { display: none; }
        #mainApp { display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <img src="https://upload.wikimedia.org/wikipedia/en/2/23/Arena_of_Valor_logo.png" alt="RoV Logo" class="rov-logo">
    <div style="font-size: 1.2rem; font-weight: bold;">FINDER COMMUNITY</div>
</header>

<div id="authApp" class="auth-container">
    <div class="tabs">
        <div id="tabLogin" class="tab active" onclick="switchTab('login')">เข้าสู่ระบบ</div>
        <div id="tabReg" class="tab" onclick="switchTab('reg')">สมัครสมาชิก</div>
    </div>
    
    <div id="loginFields">
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn-main" onclick="handleLogin()">เข้าสู่ระบบ</button>
    </div>

    <div id="regFields" class="hidden">
        <input type="text" id="regUser" placeholder="ตั้งชื่อ Username">
        <input type="password" id="regPass" placeholder="ตั้งรหัสผ่าน">
        <input type="tel" id="regPhone" placeholder="เบอร์โทรศัพท์">
        <button class="btn-main" onclick="handleRegister()">สมัครสมาชิก</button>
    </div>
</div>

<div id="mainApp" class="container">
    <div class="user-bar">
        <div>
            <span id="displayUserName" class="username"></span>
            <span id="adminBadge" class="admin-badge hidden">ADMIN</span>
        </div>
        <button onclick="handleLogout()" style="background:none; border:none; color:#ff4757; cursor:pointer;">ออกจากระบบ</button>
    </div>

    <div class="card" style="background:var(--card); padding:20px; border-radius:12px; margin-bottom:20px;">
        <h4 style="margin:0 0 10px 0;">🎮 ประกาศหาทีม</h4>
        <select id="gameMode" style="width:100%; padding:10px; background:#111; color:#fff; border-radius:8px; border:1px solid #333;">
            <option value="Ranked 5v5">จัดอันดับ (Ranked)</option>
            <option value="Normal 5v5">โหมดปกติ (Normal)</option>
        </select>
        <input type="number" id="roomNumber" placeholder="เลขห้อง 6 หลัก">
        <button class="btn-main" onclick="createPost()">ลงประกาศ</button>
    </div>

    <div id="feed"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- ⚠️ กรุณาใส่ Config ของคุณตรงนี้ ⚠️ ---
   const firebaseConfig = {
  apiKey: "AIzaSyC_HN2WdK2XOw6uJ0-zbDG32PyLRrCnwp4",
  authDomain: "rov-party-finder.firebaseapp.com",
  projectId: "rov-party-finder",
  storageBucket: "rov-party-finder.firebasestorage.app",
  messagingSenderId: "546055281977",
  appId: "1:546055281977:web:e796a62d4d43b77e935ce8",
  measurementId: "G-3C99LWGH1L"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ระบุ UID ของ Admin (ดูได้จาก Firebase Console หลังจากสมัครตัวแรก)
    const ADMIN_UID = "ใส่_UID_ของตัวคุณเองที่นี่"; 

    let currentUser = null;

    // --- UI Logic ---
    window.switchTab = (type) => {
        if(type === 'login') {
            document.getElementById('loginFields').classList.remove('hidden');
            document.getElementById('regFields').classList.add('hidden');
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabReg').classList.remove('active');
        } else {
            document.getElementById('loginFields').classList.add('hidden');
            document.getElementById('regFields').classList.remove('hidden');
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabReg').classList.add('active');
        }
    }

    // --- Auth Logic ---
    window.handleRegister = async () => {
        const user = document.getElementById('regUser').value;
        const pass = document.getElementById('regPass').value;
        const phone = document.getElementById('regPhone').value;

        if(!user || pass.length < 6 || !phone) {
            return Swal.fire('ผิดพลาด', 'กรุณากรอกข้อมูลให้ครบ (รหัส 6 ตัวขึ้นไป)', 'error');
        }

        try {
            // ใช้ email จำลองจาก username เพื่อให้ใช้ระบบ Auth ของ Firebase ได้
            const email = `${user}@rovfinder.com`;
            const res = await createUserWithEmailAndPassword(auth, email, pass);
            
            // เก็บข้อมูลเพิ่มใน Firestore
            await setDoc(doc(db, "users", res.user.uid), {
                username: user,
                phone: phone,
                role: 'user'
            });

            await updateProfile(res.user, { displayName: user });
            Swal.fire('สำเร็จ', 'สมัครสมาชิกเรียบร้อย', 'success');
        } catch (e) {
            Swal.fire('ผิดพลาด', e.message, 'error');
        }
    }

    window.handleLogin = async () => {
        const user = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;
        try {
            const email = `${user}@rovfinder.com`;
            await signInWithEmailAndPassword(auth, email, pass);
            Swal.fire('สำเร็จ', 'ยินดีต้อนรับกลับครับ', 'success');
        } catch (e) {
            Swal.fire('เข้าสู่ระบบไม่สำเร็จ', 'ชื่อผู้ใช้หรือรหัสผ่านผิด', 'error');
        }
    }

    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
        const authApp = document.getElementById('authApp');
        const mainApp = document.getElementById('mainApp');
        
        if (user) {
            currentUser = user;
            authApp.style.display = 'none';
            mainApp.style.display = 'block';
            document.getElementById('displayUserName').innerText = user.displayName;
            
            if(user.uid === ADMIN_UID) {
                document.getElementById('adminBadge').classList.remove('hidden');
            }
            loadFeed();
        } else {
            authApp.style.display = 'block';
            mainApp.style.display = 'none';
        }
    });

    // --- Database Logic ---
    window.createPost = async () => {
        const room = document.getElementById('roomNumber').value;
        const mode = document.getElementById('gameMode').value;
        
        if(!room) return Swal.fire('ลืมใส่เลขห้อง!', '', 'warning');

        // ดึงเบอร์โทรจาก Firestore
        const userDoc = await getDoc(doc(db, "users", currentUser.uid));
        const userData = userDoc.data();

        await addDoc(collection(db, "posts"), {
            uid: currentUser.uid,
            username: currentUser.displayName,
            phone: userData.phone,
            room: room,
            mode: mode,
            createdAt: new Date()
        });

        document.getElementById('roomNumber').value = '';
        Swal.fire({ title: 'บันทึกสำเร็จ!', icon: 'success', confirmButtonColor: '#3085d6' });
    }

    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snaps) => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snaps.forEach((d) => {
                const data = d.data();
                const isOwner = currentUser.uid === data.uid;
                const isAdmin = currentUser.uid === ADMIN_UID;

                feed.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div>
                                <span class="username">${data.username}</span>
                                <div class="phone-tag"><i class="fas fa-phone"></i> ${data.phone}</div>
                            </div>
                            ${isOwner || isAdmin ? `<button class="btn-delete" onclick="deletePost('${d.id}')">ลบ</button>` : ''}
                        </div>
                        <div style="margin-top:10px; font-size:0.9rem; color:var(--primary)">${data.mode}</div>
                        <div class="room-display">
                            <div style="font-size:0.7rem; color:#555">ROOM ID</div>
                            <div class="room-id">${data.room}</div>
                        </div>
                        <button onclick="navigator.clipboard.writeText('${data.room}'); Swal.fire('คัดลอกแล้ว','','success')" 
                                style="width:100%; padding:5px; border-radius:5px; border:none; background:#333; color:#fff; cursor:pointer;">
                            คัดลอกเลขห้อง
                        </button>
                    </div>
                `;
            });
        });
    }

    window.deletePost = async (id) => {
        const result = await Swal.fire({
            title: 'ยืนยันการลบ?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'ลบเลย',
            cancelButtonText: 'ยกเลิก'
        });

        if(result.isConfirmed) {
            await deleteDoc(doc(db, "posts", id));
            Swal.fire('ลบแล้ว!', '', 'success');
        }
    }
</script>

</body>
</html>
